<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>K-PATCH 2.0 - Aren Ammo 95</title>
  <style>
    :root {
      --bg: #060606;
      --bg-soft: #141414;
      --gold: #e5c369;
      --gold-bright: #ffd978;
      --text: #f2f2f2;
      --danger: #ff5f5f;
      --ok: #78ff9b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 20% 20%, #2b2108 0, transparent 45%),
        radial-gradient(circle at 80% 80%, #1f1502 0, transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .shell {
      width: min(960px, 100%);
      border: 1px solid rgba(229, 195, 105, 0.3);
      border-radius: 18px;
      overflow: hidden;
      background: linear-gradient(170deg, rgba(16, 16, 16, 0.98), rgba(6, 6, 6, 0.98));
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(229, 195, 105, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(0, 0, 0, 0.35);
    }

    .header h1 {
      margin: 0;
      font-size: 1rem;
      letter-spacing: 0.08em;
      color: var(--gold);
    }

    .status {
      font-size: 0.86rem;
      opacity: 0.9;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 0;
      min-height: 620px;
    }

    @media (max-width: 860px) {
      .content {
        grid-template-columns: 1fr;
      }
    }

    .stage {
      padding: 22px;
      border-right: 1px solid rgba(229, 195, 105, 0.15);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    @media (max-width: 860px) {
      .stage {
        border-right: 0;
        border-bottom: 1px solid rgba(229, 195, 105, 0.15);
      }
    }

    .progress-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress-bar {
      width: 100%;
      height: 10px;
      border-radius: 999px;
      background: #232323;
      border: 1px solid rgba(229, 195, 105, 0.3);
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #8a6920, var(--gold-bright));
      transition: width 0.25s ease;
    }

    .stage-media {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 12px;
      border: 1px solid rgba(229, 195, 105, 0.4);
      overflow: hidden;
      background: #0d0d0d;
      display: grid;
      place-items: center;
    }

    .stage-media.fallback-grid {
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(0deg, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        radial-gradient(circle at 20% 20%, rgba(227, 190, 91, 0.18), transparent 35%),
        #0d0d0d;
      background-size: 20px 20px, 20px 20px, auto, auto;
    }

    #missionVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .fallback-note {
      position: absolute;
      inset: auto 10px 10px 10px;
      border: 1px solid rgba(229, 195, 105, 0.25);
      border-radius: 8px;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.55);
      color: #d7d7d7;
      font-size: 0.78rem;
      display: none;
    }

    .stage-media.fallback-grid .fallback-note {
      display: block;
    }

    .q-card {
      border: 1px solid rgba(229, 195, 105, 0.24);
      border-radius: 12px;
      padding: 14px;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .rank {
      color: var(--gold-bright);
      font-weight: 700;
      font-size: 0.9rem;
    }

    .question {
      font-size: 1.08rem;
      line-height: 1.45;
      font-weight: 700;
    }

    .en {
      font-size: 0.85rem;
      opacity: 0.7;
    }

    .panel {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      justify-content: center;
    }

    .screen {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .screen.active {
      display: flex;
    }

    .battle-button {
      border: 1px solid rgba(229, 195, 105, 0.5);
      background: linear-gradient(180deg, #4a3810, #2a2009);
      color: var(--gold-bright);
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .battle-button:hover {
      filter: brightness(1.12);
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .option-btn {
      border: 1px solid rgba(229, 195, 105, 0.26);
      background: #111;
      color: var(--text);
      border-radius: 10px;
      padding: 12px 14px;
      cursor: pointer;
      text-align: left;
      font-size: 0.96rem;
      transition: transform 0.1s ease, border-color 0.2s ease, background 0.2s ease;
    }

    .option-btn:hover:enabled {
      border-color: rgba(255, 217, 120, 0.9);
      transform: translateY(-1px);
    }

    .option-btn.correct {
      border-color: rgba(120, 255, 155, 0.7);
      background: rgba(120, 255, 155, 0.16);
    }

    .option-btn.wrong {
      border-color: rgba(255, 95, 95, 0.85);
      background: rgba(255, 95, 95, 0.12);
    }

    .feedback {
      min-height: 24px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .feedback.ok {
      color: var(--ok);
    }

    .feedback.fail {
      color: var(--danger);
    }

    .shake {
      animation: shake 0.4s linear;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }
  </style>
</head>

        { id: 92, rank: "대장", q: "멘탈갑라고 반응하고 싶은 순간", en: "When you want to say 멘탈갑", a: "멘탈갑", o: ["멘탈갑", "안녕", "현웃터짐", "퇴근각"], v: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerJoyrides.mp4" },
        { id: 93, rank: "대장", q: "불굴이다라고 반응하고 싶은 순간", en: "When you want to say 불굴이다", a: "불굴이다", o: ["불굴이다", "완전웃겨", "급발진", "아 시발"], v: "https://storage.googleapis.com/gtv-videos-bucket/sample/ForBiggerMeltdowns.mp4" },
        { id: 94, rank: "대장", q: "완성형라고 반응하고 싶은 순간", en: "When you want to say 완성형", a: "완성형", o: ["완성형", "뭥미", "급정색", "심쿵"], v: "https://storage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4" },
        { id: 95, rank: "대장", q: "갓생을 살고 있는 자신에게", en: "Living a great life", a: "갓생", o: ["갓생", "노답", "폭망", "그럭저럭"], v: "https://storage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4" }
      ]
    };

    const state = {
      index: 0,
      score: 0,
      lock: false,
      audio: null,
      unlocked: false
    };

    const startBtn = document.getElementById("startBtn");
    const startScreen = document.getElementById("startScreen");
    const quizScreen = document.getElementById("quizScreen");
    const optionsEl = document.getElementById("options");
    const feedbackEl = document.getElementById("feedback");
    const questionText = document.getElementById("questionText");
    const questionEn = document.getElementById("questionEn");
    const rankText = document.getElementById("rankText");
    const progressFill = document.getElementById("progressFill");
    const stepText = document.getElementById("stepText");
    const hud = document.getElementById("hud");
    const missionVideo = document.getElementById("missionVideo");
    const stageMedia = document.getElementById("stageMedia");
    const battleCard = document.getElementById("battleCard");

    if (!startBtn) {
      console.error("startBtn is null. Mission boot aborted.");
      return;
    }

    function timeoutReject(ms, label) {
      return new Promise((_, reject) => {
        setTimeout(() => reject(new Error(`${label} timeout`)), ms);
      });
    }

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function unlockMediaContext() {
      if (!state.audio) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) {
          state.audio = new AudioCtx();
        }
      }

      if (state.audio && state.audio.state === "suspended") {
        try {
          await Promise.race([state.audio.resume(), timeoutReject(1200, "Audio resume")]);
        } catch (err) {
          console.warn("Audio resume blocked:", err);
        }
      }

      if (state.audio) {
        try {
          const osc = state.audio.createOscillator();
          const gain = state.audio.createGain();
          gain.gain.value = 0.00001;
          osc.connect(gain);
          gain.connect(state.audio.destination);
          osc.start();
          osc.stop(state.audio.currentTime + 0.03);
        } catch (err) {
          console.warn("Silent unlock tone failed:", err);
        }
      }

      missionVideo.muted = true;
      missionVideo.playsInline = true;
      try {
        const unlockPlay = missionVideo.play();
        if (unlockPlay && typeof unlockPlay.then === "function") {
          await Promise.race([unlockPlay, timeoutReject(1200, "Video unlock play")]);
        }
        missionVideo.pause();
        missionVideo.currentTime = 0;
      } catch (err) {
        console.warn("Video unlock blocked:", err);
      }
      state.unlocked = true;
    }

    function playSfx(type) {
      if (!state.audio) return;
      if (state.audio.state === "suspended") {
        state.audio.resume().catch(() => {});
      }

      const osc = state.audio.createOscillator();
      const gain = state.audio.createGain();

      const now = state.audio.currentTime;
      const duration = type === "ok" ? 0.12 : 0.35;
      osc.type = type === "ok" ? "triangle" : "sawtooth";
      osc.frequency.setValueAtTime(type === "ok" ? 920 : 180, now);
      if (type === "fail") {
        osc.frequency.exponentialRampToValueAtTime(120, now + duration);
      }

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.18, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(state.audio.destination);
      osc.start(now);
      osc.stop(now + duration);
    }

    function vibrateOrShake(ms) {
      if (navigator.vibrate) {
        navigator.vibrate(ms);
        return;
      }

      battleCard.classList.remove("shake");
      void battleCard.offsetWidth;
      battleCard.classList.add("shake");
      setTimeout(() => battleCard.classList.remove("shake"), ms);
    }

    function activateVideoFallback() {
      stageMedia.classList.add("fallback-grid");
      missionVideo.style.display = "none";
    }

    async function loadVideo(url) {
      stageMedia.classList.remove("fallback-grid");
      missionVideo.style.display = "block";
      missionVideo.muted = true;
      missionVideo.playsInline = true;
      missionVideo.onerror = activateVideoFallback;
      missionVideo.onstalled = activateVideoFallback;
      missionVideo.onabort = activateVideoFallback;

      missionVideo.src = url;
      missionVideo.load();
      try {
        const playPromise = missionVideo.play();
        if (playPromise && typeof playPromise.then === "function") {
          await Promise.race([playPromise, timeoutReject(1500, "Video play")]);
        }
      } catch (err) {
        console.warn("Video load/play fallback:", err);
        activateVideoFallback();
      }
    }

    function updateProgress() {
      const total = db.steps.length;
      const current = Math.min(state.index + 1, total);
      stepText.textContent = `STEP ${current} / ${total}`;
      progressFill.style.width = `${(state.index / total) * 100}%`;
      hud.textContent = `SCORE ${state.score} / ${total}`;
    }

    function showCompletion() {
      rankText.textContent = "MISSION COMPLETE";
      questionText.textContent = `작전 종료: ${state.score} / ${db.steps.length} 정답`;
      questionEn.textContent = "Deployment complete. Press to restart.";
      optionsEl.innerHTML = "";
      feedbackEl.textContent = "";
      const restart = document.createElement("button");
      restart.className = "battle-button";
      restart.textContent = "REDEPLOY";
      restart.addEventListener("click", () => {
        state.index = 0;
        state.score = 0;
        state.lock = false;
        renderStep();
      });
      optionsEl.appendChild(restart);
      progressFill.style.width = "100%";
      stepText.textContent = `STEP ${db.steps.length} / ${db.steps.length}`;
      hud.textContent = `MISSION END // ${state.score} HIT`;
    }

    function renderStep() {
      updateProgress();
      if (state.index >= db.steps.length) {
        showCompletion();
        return;
      }

      feedbackEl.textContent = "";
      feedbackEl.className = "feedback";
      optionsEl.innerHTML = "";

      const step = db.steps[state.index];
      rankText.textContent = `${step.rank} // ${step.id}단계`;
      questionText.textContent = step.q;
      questionEn.textContent = step.en;
      void loadVideo(step.v);

      const opts = [...step.o];
      if (!opts.includes(step.a)) {
        opts[0] = step.a;
      }
      const shuffled = shuffle(opts);

      shuffled.forEach((choice) => {
        const btn = document.createElement("button");
        btn.className = "option-btn";
        btn.textContent = choice;
        btn.addEventListener("click", () => handleAnswer(choice, step.a, btn));
        optionsEl.appendChild(btn);
      });
    }

    function handleAnswer(choice, answer, selectedBtn) {
      if (state.lock) return;
      state.lock = true;

      const buttons = Array.from(optionsEl.querySelectorAll(".option-btn"));
      buttons.forEach((btn) => {
        btn.disabled = true;
        if (btn.textContent === answer) btn.classList.add("correct");
      });

      if (choice === answer) {
        selectedBtn.classList.add("correct");
        feedbackEl.textContent = "정답! 전술 탄알 명중.";
        feedbackEl.className = "feedback ok";
        state.score += 1;
        vibrateOrShake(100);
        playSfx("ok");
      } else {
        selectedBtn.classList.add("wrong");
        feedbackEl.textContent = `오답! 정답은 "${answer}"`;
        feedbackEl.className = "feedback fail";
        vibrateOrShake(400);
        playSfx("fail");
      }

      setTimeout(() => {
        state.index += 1;
        state.lock = false;
        renderStep();
      }, 900);
    }

    startBtn.addEventListener("click", async () => {
      console.log("Battle Start Triggered");
      startBtn.disabled = true;
      try {
        if (!state.unlocked) {
          await unlockMediaContext();
        }
      } catch (err) {
        console.warn("Media unlock workaround applied:", err);
      } finally {
        startScreen.classList.remove("active");
        quizScreen.classList.add("active");
        state.index = 0;
        state.score = 0;
        state.lock = false;
        renderStep();
        startBtn.disabled = false;
      }
    });
    });
  </script>
</body>
